<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publications & Newsletters | Ab Initio Legal LLP</title>
  <meta name="description" content="Newsletters, articles, research papers and legal updates published by Ab Initio Legal.">
  <meta name="theme-color" content="#0e0e11">
  <meta property="og:title" content="Publications & Newsletters | Ab Initio Legal LLP">
  <meta property="og:description" content="Newsletters, articles, research papers and legal updates published by Ab Initio Legal.">
  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="assets/img/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="publications">
  <div id="ail-header"></div>

  <main>
    <section class="page-banner">
      <div class="page-banner__img" style="background-image:url('assets/img/banners/supreme-court-colonnade.jpg');background-position:center 40%" data-parallax="10"></div>
      <div class="container-xl">
        <ul class="crumbs"><li><a href="index.html">Home</a></li><li>Publications</li></ul>
        <h1 data-split>Publications &amp; <em>Newsletters</em></h1>
        <p>Our newsletters, articles, research papers and legal updates — arranged with the latest first.</p>
      </div>
    </section>

    <section class="section">
      <div class="container-xl">
        <div class="pub-toolbar" data-reveal>
          <div class="filters" id="pubFilters" role="tablist" aria-label="Filter publications"></div>
          <div class="pub-search">
            <input type="search" id="pubSearch" placeholder="Search publications…" aria-label="Search publications">
            <i class="bi bi-search"></i>
          </div>
        </div>
        <div id="pubList"></div>

        <div class="subscribe-band mt-6" data-reveal>
          <div>
            <div class="eyebrow">Stay Informed</div>
            <h2 class="section-title mb-2" style="font-size:clamp(2rem,3.4vw,2.8rem)">Subscribe to our <em>newsletter.</em></h2>
            <p class="mb-0 text-muted">Key judgments, regulatory updates and analysis — delivered to your inbox.</p>
          </div>
          <div>
            <form class="form-ail" data-ail-form data-success="#subSuccess" data-endpoint="/api/newsletter/subscribe" novalidate>
              <div class="row g-3 align-items-end">
                <div class="col-sm-7"><div class="field mb-0"><label class="lbl" for="subEmail">Email address</label><input class="form-control" id="subEmail" name="email" type="email" required placeholder="you@company.com"></div></div>
                <div class="col-sm-5"><button type="submit" class="btn-ail w-100 justify-content-center">Subscribe</button></div>
              </div>
            </form>
            <div class="form-success py-3" id="subSuccess"><p class="mb-0 text-gold fw-semibold"><i class="bi bi-check2-circle me-2"></i>Thank you — you’re subscribed.</p></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="ail-footer"></div>

  <script src="assets/vendor/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/vendor/ScrollTrigger.min.js"></script>
  <script src="assets/data/site-data.js"></script>
  <script src="assets/data/publications.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
